<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Espace cheffe</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fff8ec">
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .status { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
    .status.paid, .status.pending { background: var(--sun-soft); color: #9a5a00; }
    .status.preparing { background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand); }
    .status.ready, .status.accepted { background: #e2ecff; color: #2c5bb5; }
    .status.collected, .status.confirmed { background: var(--leaf-soft); color: var(--leaf); }
    .status.cancelled, .status.declined, .status.awaiting_payment { opacity: .7; }
    .order { display: flex; flex-direction: column; gap: 10px; }
    .dim { opacity: .55; }
    @media print { .topbar, .tabs, .days, .order, .btn, .banner { display: none !important; } body { background: #fff; } }
    .prep { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14.5px; }
    .prep b { font-variant-numeric: tabular-nums; text-align: right; }
    .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .switch:last-child { border-bottom: 0; }
    .switch input { width: 22px; height: 22px; accent-color: var(--brand); flex: none; }
    .kv { font-size: 14px; display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; }
    .kv span:nth-child(odd) { color: var(--muted); }
    .setup li { margin: 4px 0; }
  </style>
</head>
<body>
  <header class="topbar"><a href="/" class="brand"><img src="assets/mark.svg" alt="" width="36" height="36"><span>Espace<b> cheffe</b></span></a><button class="btn small" id="logout" hidden>Déconnexion</button></header>
  <nav class="tabs" id="tabs" hidden>
    <a href="#commandes" data-route="commandes">Commandes</a>
    <a href="#demandes" data-route="demandes">Demandes</a>
    <a href="#carte" data-route="carte">Carte & pause</a>
  </nav>
  <main id="view"></main>
  <div class="toast" id="toast" role="status"></div>
  <script src="data/config.js"></script>
  <script src="data/menu.js"></script>
  <script src="admin.js"></script>
</body>
</html>
