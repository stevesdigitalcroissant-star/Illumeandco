<!DOCTYPE html>
<html lang="en" style="background:#ffffff">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Illume — Thank you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ind.css">
<style>
body{background:var(--panel) !important}
.thanks-wrap{min-height:88vh;display:flex;align-items:center;justify-content:center;padding:60px 20px}
.thanks-card{background:var(--paper);border-radius:28px;max-width:560px;width:100%;padding:64px 52px;text-align:center;box-shadow:0 30px 70px -30px rgba(16,16,16,.18)}
.check-badge{width:64px;height:64px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 28px;box-shadow:0 12px 28px -10px rgba(255,90,60,.55)}
.check-badge svg{width:28px;height:28px}
.thanks-card h1{font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:clamp(28px,4.4vw,40px);line-height:1.1;color:var(--ink)}
.thanks-card p{margin-top:16px;font-size:16px;color:var(--ink-soft);line-height:1.6;max-width:40ch;margin-left:auto;margin-right:auto}
.thanks-note{margin-top:30px;padding-top:26px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.thanks-actions{margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.thanks-actions .btn-outline{padding:14px 26px}
@media (max-width:520px){.thanks-card{padding:48px 28px}}
</style>
</head>
<body style="background:var(--panel)">
<div class="wrap">
<header class="masthead">
<a class="logo-link" href="index.html" aria-label="Illume home"><img src="logo.svg" alt="Illume"></a>
</header>
</div>
<div class="thanks-wrap">
<div class="thanks-card">
<div class="check-badge">
<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
</div>
<h1>Got it — thank you.</h1>
<p>Your project details are on their way to our studio inbox. We'll reply personally soon to talk through your brand and next steps.</p>
<div class="thanks-actions">
<a class="btn" href="index.html" style="background:var(--accent)">Back to home</a>
<a class="btn btn-outline" href="portfolio.html">See the work</a>
</div>
<div class="thanks-note">Illume &middot; steves.digitalcroissant@gmail.com</div>
</div>
</div>
</body>
</html>
