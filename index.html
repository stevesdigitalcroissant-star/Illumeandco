<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calorie Coach</title>
  <meta name="description" content="Track what you eat, see the full nutrition of every meal, and get meal ideas built around your body, your family health history and how much you like to cook.">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141613" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Calorie Coach">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button data-tab="today" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Today</span></button>
    <button data-tab="add" class="tab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Log food</span></button>
    <button data-tab="meals" class="tab"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M7 3v5M11 3v5a2 2 0 0 1-2 2M17 21V3c-2 1-3 3.5-3 7 0 2 1 3 3 3"/></svg><span>Meal ideas</span></button>
    <button data-tab="insights" class="tab"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Habits</span></button>
    <button data-tab="profile" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Me</span></button>
  </nav>

  <div class="sheet-wrap" id="sheetWrap" hidden>
    <div class="sheet-backdrop" data-close></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="data/foods.js"></script>
  <script src="data/recipes.js"></script>
  <script src="app.js"></script>
</body>
</html>
